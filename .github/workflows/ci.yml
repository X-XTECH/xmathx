name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Validate, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: node scripts/lint-content.mjs
      - run: npm run typecheck
      - run: npm run build

  live:
    name: Live site responds
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the production site
        run: |
          url="https://xmathx-x-xtech.vercel.app/"
          echo "--- headers without following redirects"
          curl -s -D - -o /dev/null "$url" | head -20
          echo "--- following redirects"
          code=$(curl -s -L -o page.html -w "%{http_code} final=%{url_effective}" "$url")
          echo "status $code"
          grep -o "<title>[^<]*</title>" page.html || true
          grep -c "_next/static" page.html || true
          case "$code" in
            "200 final=https://xmathx-x-xtech.vercel.app/"*) grep -q "_next/static" page.html && echo "live and public" ;;
            *vercel.com/login*) echo "site is built but Vercel Authentication is on, visitors are sent to a Vercel login"; exit 1 ;;
            *) echo "unexpected response"; exit 1 ;;
          esac
