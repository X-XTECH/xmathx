name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Validate, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: node scripts/lint-content.mjs
      - run: npm run typecheck
      - run: npm run build

  live:
    name: Live site responds
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the production site
        run: |
          url="https://xmathx-x-xtech.vercel.app/"
          code=$(curl -s -o page.html -w "%{http_code}" "$url")
          echo "status $code"
          grep -o "<title>[^<]*</title>" page.html || true
          grep -c "_next/static" page.html || true
          test "$code" = "200"
